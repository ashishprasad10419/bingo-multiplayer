server:
  port: 8080

spring:
  application:
    name: bingo-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bingo_db}
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours
  cookie-name: token

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,https://bingoplay.vercel.app}

game:
  board-size: 5
  winning-lines: 5
  max-players: 6
  disconnect-grace-seconds: 60

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
